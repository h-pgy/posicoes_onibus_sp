[project]
name = "posicoes-onibus-sp"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "pandas>=3.1.0",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
    "streamlit>=1.66.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "--import-mode=importlib"
markers = [
    "integration: testes que chamam a API real da SPTrans",
]
